<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/base.css">

<body>
    <!-- Navbar: dibuat oleh js/komponen/navbar.js -->
    <header data-komponen="navbar" data-aktif="modul"></header>
 
    <main>
        <!-- Hero -->
        <section class="modul-hero">
            <div class="art" role="img" aria-label="Maskot robot SIROBOT"></div>
            <div>
                <h1>Yuk lihat apa saja <span class="sorot">Modul</span> pembelajarannya</h1>
                <p>Di sini kita belajar beberapa cara kerja suatu IC robot, dari Arduino hingga ke Jetson Nano.</p>
            </div>
        </section>
 
        <!-- Daftar modul -->
        <section class="modul-daftar">
            <h2 class="garis-merah">Modul Pembelajaran</h2>
            <p>Yuk pelajari modul dari IR 64 Robotics</p>
 
            <form class="modul-filter" action="#" method="get">
                <ul class="pill-list" aria-label="Waktu">
                    <li><a href="modul.html" class="aktif" data-waktu="semua">Semua</a></li>
                    <li><a href="modul.html?waktu=sekarang" data-waktu="sekarang">Sekarang</a></li>
                    <li><a href="modul.html?waktu=dahulu" data-waktu="dahulu">Dahulu</a></li>
                </ul>
                <p>
                    <label for="kategori">Kategori riset</label>
                    <select id="kategori" name="kategori">
                        <option value="">Semua kategori</option>
                    </select>
                </p>
                <p>
                    <label for="tahun">Pilih tahun modul</label>
                    <select id="tahun" name="tahun">
                        <option value="">Semua tahun</option>
                    </select>
                </p>
                <p>
                    <label for="cari-modul">Cari modul</label>
                    <input type="search" id="cari-modul" name="cari" placeholder="Cari modul disini...">
                </p>
            </form>
 
            <!-- kartu modul dibuat oleh js/modul.js dari js/data.js -->
 
        </section>
    </main>
 
    <!-- Footer: dibuat oleh js/komponen/footer.js -->
    <footer data-komponen="footer"></footer>
 
    <script src="js/komponen/navbar.js"></script>
