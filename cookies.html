<link rel="stylesheet" href="css/cookies.css">
<script src="js/komponen/cookies.js"></script>
<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Persetujuan cookies">
    <div class="cookie-content">
        <div class="cookie-icon">🍪</div>

        <div class="cookie-text">
            <h3>Website ini menggunakan cookies</h3>
            <p>
                Kami menggunakan cookies untuk meningkatkan
                pengalaman pengguna dan mengingat preferensi Anda.
            </p>
        </div>
    </div>

    <div class="cookie-actions">
        <button id="cookie-reject" class="cookie-btn cookie-reject">
            Tolak
        </button>

        <button id="cookie-accept" class="cookie-btn cookie-accept">
            Terima Semua
        </button>
    </div>
</div>
